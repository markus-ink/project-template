name: タスク
properties:
  ステータス:
    type: status
    options:
      - { name: 未着手, color: gray }
      - { name: 進行中, color: blue }
      - { name: 完了, color: green }
    default: 未着手
  セレクト:
    type: select
    options: [{ name: 高, color: red }, { name: 中, color: yellow }, { name: 低, color: green }]
  作成者: { type: created_by }
  作成日時: { type: created_time }
