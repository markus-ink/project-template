name: Tasks
properties:
  Status:
    type: status
    options:
      - { name: Not started, color: gray }
      - { name: In progress, color: blue }
      - { name: Done, color: green }
    default: Not started
  Select:
    type: select
    options: [{ name: High, color: red }, { name: Medium, color: yellow }, { name: Low, color: green }]
  Created by: { type: created_by }
  Created time: { type: created_time }
